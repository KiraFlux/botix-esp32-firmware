# KiraFlux Toolkit - Example Project Configuration
#
# PlatformIO configuration for ESP32 and native builds.
# All examples share common build flags and library paths.
# Repository: https://github.com/KiraFlux/KiraFlux-Toolkit

[platformio]
build_cache_dir = .pio/build_cache

default_envs = esp32dev


[env]
monitor_speed = 115200

lib_deps = 
	https://github.com/KiraFlux/KiraFlux-Toolkit.git#dev
    okalachev/MAVLink@^2.0.22

build_flags = 
    -std=gnu++20
    -D NO_GLOBAL_INSTANCES
    -Wno-address-of-packed-member


[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino


[env:native]
platform = native

# Host tests cover the platform-independent logic only (lexeme parsing and
# offset-based config access), so the Arduino-dependent sources stay out.
test_build_src = no

build_flags =
    ${env.build_flags}
    -I src
    # The toolkit is not added to the native include path automatically
    -I .pio/libdeps/native/KiraFlux-Toolkit/src
    # Some config fields are 64-bit reals, so the assertions need double support
    -D UNITY_INCLUDE_DOUBLE
